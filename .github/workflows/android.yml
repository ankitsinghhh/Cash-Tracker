name: Android validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleBenchmarkRelease :benchmarks:assembleBenchmarkRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            app/build/reports/
            app/build/outputs/apk/
            benchmarks/build/outputs/apk/
